name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/run_tests.py --suite default -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: data/processed/test_reports/

  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invest_bot_test
          POSTGRES_USER: invest_bot_test
          POSTGRES_PASSWORD: invest_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invest_bot_test -d invest_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QA_POSTGRESQL_URL: postgresql+psycopg://invest_bot_test:invest_bot_test@localhost:5432/invest_bot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/run_tests.py --suite postgresql tests/integration/test_postgresql_migrations.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-migration-results
          path: data/processed/test_reports/
